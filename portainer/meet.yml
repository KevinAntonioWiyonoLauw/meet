services:
  meet:
    image: ghcr.io/kevinantoniowiyonolauw/meet:latest
    pull_policy: always
    container_name: meet
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/meet.db
      - AUTH_SECRET=RYesA43/UK2BYZE5OCq0Frp0oZIKAoN07dsGcotSDWF5p2IgLRVQQerOntS2pi+
      - AUTH_TRUST_HOST=true
    volumes:
      - meet-data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meet.rule=Host(`meet.kevinio.my.id`)"
      - "traefik.http.routers.meet.entrypoints=web"
      - "traefik.http.services.meet.loadbalancer.server.port=3000"

volumes:
  meet-data:

networks:
  proxy:
    external: true