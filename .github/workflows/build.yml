name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kevinantoniowiyonolauw/meet

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Trigger Portainer redeploy
        run: |
          curl -sf -X POST \
            "http://192.168.18.164:9000/api/stacks/6/start?endpointId=3" \
            -H "Authorization: Bearer ${{ secrets.PORTAINER_TOKEN }}" \
            --data "{}" || echo "skip: no token"